services:
  - type: web
    name: medvault
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: MASTER_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: LOG_SIGNING_KEY
        sync: false
